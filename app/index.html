<!doctype html>

<div class="shell" id="appShell">
  <div id="demoBanner" class="demo-banner" hidden><b>데모 모드</b> · 샘플 데이터로 체험 중입니다. 조회 기록은 이 브라우저에만 저장됩니다.</div>

    <div class="topbar-in">

        <span>Trade Checker</span>
      </a>
      <span class="spacer"></span>
      <span class="planchip" id="planchip"></span>
      <button class="btn btn-ghost btn-sm" id="logout" type="button" hidden>로그아웃</button>

    <a href="#/search" data-nav="search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>조회</a>
